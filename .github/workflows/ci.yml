on: [push, pull_request]
name: Test
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        # Keep up with dependencies that raise their minimum Go version.
        go-version: 'stable'
    - name: Run tests
      run: make test
